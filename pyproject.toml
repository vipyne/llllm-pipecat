[project]
name = "pipecat-quickstart"
version = "0.1.0"
description = "Voice AI bot built with Pipecat"
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai[kokoro,moq,silero,webrtc,whisper]",
    "pipecatcloud",
    "pipecat-ai[mlx-whisper]>=1.7.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "pyaudio>=0.2.14",
    "pypdf",
    "chromadb",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.2",
]

[dependency-groups]
dev = [
    "pyright>=1.1.404,<2",
    "ruff>=0.12.11,<1",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I", "UP"]
